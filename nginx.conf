# 員工登入（CRM 帳號）的轉發。這個檔被 include 在 http 區塊裡，所以 limit_req_zone 可以放這裡。
# 登入節流：每個 Cloudflare 來源 IP 每分鐘 2 次、可以突發 5 次（沒有 CF 標頭＝區網直連，不限）。
limit_req_zone $http_cf_connecting_ip zone=stafflogin:1m rate=2r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 內含 base64 字型的 HTML 較大,開啟 gzip 壓縮文字部分
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # 工具本體不快取,確保每次更新客戶端立即看到最新版
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── 員工登入：原樣轉給 CRM 的 /api/admin/auth/*（見 staff.js）──────────
    # 用變數＋resolver：nginx 啟動時不解析網域，CRM 一時連不上也不會讓整個站起不來。
    resolver 127.0.0.11 1.1.1.1 valid=300s ipv6=off;
    set $crm https://members.livewellgroup.com.tw;

    location = /api/staff/login {
        limit_req zone=stafflogin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $crm/api/admin/auth/login;
        proxy_set_header Host members.livewellgroup.com.tw;
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
    }
    location = /api/staff/me {
        proxy_pass $crm/api/admin/auth/me;
        proxy_set_header Host members.livewellgroup.com.tw;
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
    }
    location = /api/staff/logout {
        proxy_pass $crm/api/admin/auth/logout;
        proxy_set_header Host members.livewellgroup.com.tw;
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
    }

    location = /robots.txt {
        default_type text/plain;
    }

    location = /staff.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
